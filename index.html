<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>재료로 찾는 이유식 레시피</title>
<meta name="description" content="초기, 중기, 후기, 완료기 이유식 레시피를 재료로 검색할 수 있는 모바일 이유식 도감" />
<style>
:root{--bg:#fffaf3;--card:#fff;--ink:#27211d;--muted:#756b62;--brand:#ff8a3d;--soft:#fff0df;--line:#eadfd3;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',Segoe UI,sans-serif;}
.wrap{max-width:520px;margin:0 auto;padding-bottom:92px} header{position:sticky;top:0;z-index:5;background:rgba(255,250,243,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:22px 18px 14px}
.kicker{font-size:13px;color:#d7661f;font-weight:800} h1{font-size:30px;line-height:1.12;margin:8px 0 14px;letter-spacing:-.8px} .search{position:relative} input{width:100%;border:1px solid var(--line);border-radius:20px;padding:15px 16px;font-size:15px;background:white;outline:none} input:focus{border-color:var(--brand);box-shadow:0 0 0 4px #ff8a3d20}
main{padding:16px 18px} .notice{background:linear-gradient(135deg,#fff3e6,#fff);border:1px solid #ffd7b6;border-radius:24px;padding:15px;line-height:1.55;color:#5d4a3d;font-size:13px;margin-bottom:16px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 14px} button{border:0;cursor:pointer;font-family:inherit} .tab{border:1px solid var(--line);background:#fff;border-radius:16px;padding:11px 4px;font-weight:800;font-size:13px;color:#625850} .tab.active{background:#25211e;color:#fff;border-color:#25211e}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:18px 0 10px} .section-title h2{font-size:17px;margin:0} .count{font-size:12px;color:var(--muted)}

.card h3{margin:10px 0 5px;font-size:19px;letter-spacing:-.3px} .meta{font-size:12px;color:var(--muted);line-height:1.45} .ings{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px} .ing{background:#f4eee7;border-radius:999px;padding:6px 9px;font-size:12px;color:#5f534b} .tip{font-size:12px;color:#b25b22;margin-top:11px;line-height:1.5}

@media(min-width:700px){body{background:#f8efe5} .wrap{box-shadow:0 0 0 1px var(--line);min-height:100vh;background:var(--bg)}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="kicker">🍼 엄마표 이유식 레시피</div>
<h1>재료로 찾는<br>이유식 레시피</h1>
<div class="search"><input id="search" placeholder="예: 소고기, 애호박, 감자, 계란" /></div>
</header>
<main>
<div class="notice"><b>안전 체크</b><br>돌 전에는 꿀을 먹이지 않고, 처음 먹는 재료는 오전에 소량부터 시작해 2~3일 반응을 살펴보세요. 알레르기가 의심되면 즉시 중단하고 전문가와 상담하세요.</div>
<div class="section-title"><h2>단계별 보기</h2><span class="count" id="totalCount"></span></div>
<div class="tabs" id="tabs"></div>
<div class="section-title"><h2>가진 재료 선택</h2><button id="reset" class="chip">초기화</button></div>
<div class="chips" id="chips"></div>
<div class="section-title"><h2>검색 결과</h2><span class="count" id="resultCount"></span></div>
<div class="grid" id="list"></div>
</main>
</div>
<div class="bottom"><div class="bottom-inner" id="bottomTabs"></div></div>

const stages=['전체','초기','중기','후기','완료기'];
const stageClass={'초기':'','중기':'mid','후기':'late','완료기':'done'};
let currentStage='전체'; let selected=[]; let q='';
const ingredients=[...new Set(recipes.flatMap(r=>r.ingredients).filter(x=>!['물','물 또는 육수','진밥','밥'].includes(x)))].slice(0,48);
function el(id){return document.getElementById(id)}
function makeTabs(){
 el('tabs').innerHTML=stages.map(s=>`<button class="tab ${currentStage===s?'active':''}" onclick="setStage('${s}')">${s}</button>`).join('');
 el('bottomTabs').innerHTML=stages.slice(1).map(s=>`<button class="${currentStage===s?'active':''}" onclick="setStage('${s}')">${s}</button>`).join('');
}
function makeChips(){el('chips').innerHTML=ingredients.map(i=>`<button class="chip ${selected.includes(i)?'active':''}" onclick="toggleIng('${i}')">${i}</button>`).join('')}
function setStage(s){currentStage=s; render()}
function toggleIng(i){selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i]; render()}
el('search').addEventListener('input',e=>{q=e.target.value.trim(); render()}); el('reset').onclick=()=>{selected=[];q='';el('search').value='';render()};
function filtered(){return recipes.filter(r=>{let text=[r.title,r.stage,r.desc,...r.ingredients].join(' ');return (currentStage==='전체'||r.stage===currentStage)&&(!q||text.includes(q))&&(selected.length===0||selected.every(s=>text.includes(s)));})}
function allergen(ings){const all=['달걀','계란','우유','요거트','치즈','밀','식빵','국수','콩','두부','땅콩','견과','생선','대구','연어','새우','게','조개','참깨'];return all.filter(a=>ings.some(i=>i.includes(a)))}
function render(){makeTabs();makeChips();const data=filtered();el('totalCount').textContent=`총 ${recipes.length}개`;el('resultCount').textContent=`${data.length}개`;el('list').innerHTML=data.length?data.map((r,idx)=>{let al=allergen(r.ingredients);return `<div class="card" onclick="this.classList.toggle('open')"><div class="row"><div><span class="badge ${stageClass[r.stage]}">${r.stage}</span><h3>${r.title}</h3><div class="meta">${r.age} · ${r.texture}</div></div><div class="meta">보기</div></div><div class="ings">${r.ingredients.map(i=>`<span class="ing">${i}</span>`).join('')}</div>${al.length?`<div class="tip">알레르기 체크 가능 재료: ${[...new Set(al)].join(', ')}</div>`:''}<div class="recipe-detail"><b>설명</b><br>${r.desc}<br><br><b>만드는 법</b><ol class="steps"><li>재료를 깨끗하게 손질하고 단계에 맞게 작게 자릅니다.</li><li>고기·생선·달걀은 완전히 익힙니다.</li><li>쌀, 밥 또는 물/육수와 함께 부드럽게 끓입니다.</li><li>초기·중기는 곱게 갈고, 후기·완료기는 아이가 씹기 좋은 크기로 조절합니다.</li></ol><br><b>팁</b><br>${r.tip}</div></div>`}).join(''):'<div class="empty">조건에 맞는 레시피가 없어요.<br>재료 선택을 줄이거나 검색어를 바꿔보세요.</div>'}
render();
</script>
</body>
</html>
